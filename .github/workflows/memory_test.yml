name: Memory Test

on:
  workflow_dispatch:

jobs:
  memory-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.4.1'

      # 👇 关键点 1：确保 GitHub 的 Runner 启用 KVM 硬件加速
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --build-cache

      - name: Run Memory Test on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          # 👇 关键点 2：增加启动超时时间，并启用无头模式加速启动
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900 # 等待模拟器最多 15 分钟
          script: |
            # 👇 关键点 3：杀掉旧的 adb 服务，避免端口冲突
            adb kill-server
            adb start-server

            echo "Installing APK..."
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            
            echo "Launching App..."
            adb shell am start -W -n com.ertyu/.MainActivity

            # 👇 关键点 4：等待系统彻底完成启动（极其重要！）
            echo "等待模拟器系统完全启动..."
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done;'
            
            # 等待 App 加载完毕（给 App 留出 15 秒渲染首屏）
            echo "等待 App 界面渲染..."
            sleep 15
            
            echo "Dumping memory info..."
            adb shell dumpsys meminfo com.ertyu > meminfo_full.txt
            
            echo "================ Memory Summary ================"
            grep -E "TOTAL PSS|TOTAL RSS|Java Heap|Native Heap" meminfo_full.txt || cat meminfo_full.txt
            echo "================================================"

      - name: Upload Memory Report
        if: always() # 就算 adb 报错了，也把已经抓到的文件传上去
        uses: actions/upload-artifact@v4
        with:
          name: memory-report
          path: meminfo_full.txt
          if-no-files-found: warn