name: PR Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 👇 核心改动：并发控制
concurrency:
  # 同一个 PR 或分支的构建任务归为一组
  # 如果是 PR，group 就是 pr-123；如果是 push，group 就是 refs/heads/main
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # 当有新任务进入队列时，立即取消正在运行的旧任务
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.4.1'

    - name: Cache Android Build Cache
      uses: actions/cache@v4
      with:
        path: ~/.android/build-cache
        key: ${{ runner.os }}-android-build-cache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    - name: Cache Gradle Build Cache
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches/build-cache-1
        key: ${{ runner.os }}-gradle-build-cache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    # 编译 Debug 包
    - name: Build Debug APK
      run: |
        # 加上 --no-daemon 配合 cancel 信号，可以实现瞬间强杀，防止进程残留
        gradle assembleDebug --no-daemon --build-cache