name: Compare Junrar API

on:
  workflow_dispatch: # 允许你手动触发

jobs:
  compare-api:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JARs from Maven Central
        run: |
          echo "正在下载 junrar 7.6.0..."
          wget -q https://repo1.maven.org/maven2/com/github/junrar/junrar/7.6.0/junrar-7.6.0.jar
          echo "正在下载 junrar 8.1.2..."
          wget -q https://repo1.maven.org/maven2/com/github/junrar/junrar/8.1.2/junrar-8.1.2.jar

      - name: Extract and Compare Public APIs
        run: |
          echo "提取类名列表..."
          # 获取 jar 内的 class 列表（排除内部类 $）
          jar tf junrar-7.6.0.jar | grep '\.class$' | grep -v '\$' | sed 's/\.class$//' | tr '/' '.' > classes_v7.txt
          jar tf junrar-8.1.2.jar | grep '\.class$' | grep -v '\$' | sed 's/\.class$//' | tr '/' '.' > classes_v8.txt
          
          # 合并两个版本的类名并去重，确保都能扫到
          cat classes_v7.txt classes_v8.txt | sort -u > all_classes.txt
          
          echo "生成 7.6.0 版本 API 签名..."
          > sig_v7.txt
          while read classname; do
            javap -classpath junrar-7.6.0.jar -public "$classname" 2>/dev/null >> sig_v7.txt || true
          done < all_classes.txt
          
          echo "生成 8.1.2 版本 API 签名..."
          > sig_v8.txt
          while read classname; do
            javap -classpath junrar-8.1.2.jar -public "$classname" 2>/dev/null >> sig_v8.txt || true
          done < all_classes.txt
          
          echo "开始对比差异..."
          # 使用 diff 对比 (-B 忽略空行, -w 忽略空格)
          diff -B -w sig_v7.txt sig_v8.txt > diff.txt || true
          
          if [ -s diff.txt ]; then
            echo "=========================================================="
            echo "⚠️ 发现 API 差异 (仅显示变化的行):"
            echo "=========================================================="
            # 打印 diff 结果
            cat diff.txt
            echo "=========================================================="
          else
            echo "✅ 两个版本的公开 API 完全兼容，没有差异。"
          fi