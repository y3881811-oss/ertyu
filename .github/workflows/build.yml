name: Scheduled Release

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # actions/checkout@v4.2.2
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # actions/setup-java@v4.7.0
      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3.2.1
      # packages: '' 跳过默认包安装，避免 sdkmanager 因找不到旧 tools 包而失败
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: ''

      # gradle/actions/setup-gradle@v4.4.2
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326
        with:
          gradle-version: '8.9'

      - name: Generate version
        id: version
        run: |
          DATE=$(date -u +'%Y.%m.%d')
          TIME=$(date -u +'%H%M')
          TAG="v${DATE}-${TIME}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "版本号: ${TAG}"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$SRC" "release/MTFM-${{ steps.version.outputs.tag }}.apk"
          ls -lh release/

      # softprops/action-gh-release@v2.2.2
      - name: Create Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "MTFM ${{ steps.version.outputs.tag }}"
          body: |
            ## MTFM 自动构建版本

            - **构建时间**：${{ steps.version.outputs.date }}
            - **提交**：${{ github.sha }}
            - **类型**：Debug APK

            ### 安装说明
            1. 下载下方 APK 文件
            2. 在 Android 9 设备上允许「未知来源」安装
            3. 安装前请先卸载旧版本（签名相同可覆盖）
          files: release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # actions/upload-artifact@v4.6.2
      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MTFM-apk
          path: release/*.apk