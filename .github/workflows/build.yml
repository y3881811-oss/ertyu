name: Scheduled Release

on:
  schedule:
    - cron: '0 3 * * *'   # UTC 03:00 = 北京时间 11:00
  workflow_dispatch:
    inputs:
      publish:
        description: "构建完成后是否发布 Release（取消勾选只构建，用于测速）"
        type: boolean
        default: true
      fast:
        description: "快速构建（关闭 R8 混淆/资源压缩，约快 70~80s，APK 更大）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # 发布不中途取消，新的排队

env:
  APP_NAME: "EYU文件管理器"
  TZ: Asia/Shanghai

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 secrets.KEYSTORE_BASE64。请执行 base64 -w0 keystore/mtfm.jks 并把结果存进该 secret（不能换新证书，否则老用户无法覆盖安装）"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/mtfm.jks
          echo "✅ 已从 secrets.KEYSTORE_BASE64 还原 keystore"
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::缺少 secrets.KEYSTORE_PASSWORD"
            exit 1
          fi
          keytool -list -keystore keystore/mtfm.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null
          echo "✅ keystore 可用"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.3'
        continue-on-error: true   # 缓存服务故障时不要让整条发布流程挂掉

      - name: Generate version
        id: version
        run: |
          DATE=$(date +'%Y.%m.%d')
          TIME=$(date +'%H%M')
          TAG="v${DATE}-${TIME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "v_name=${DATE}.${TIME}" >> "$GITHUB_OUTPUT"
          echo "v_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG}"

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          FAST_FLAG=""
          if [ "${{ inputs.fast }}" = "true" ]; then FAST_FLAG="-PfastRelease=true"; fi
          echo "构建参数: $FAST_FLAG"
          gradle assembleRelease --build-cache --stacktrace $FAST_FLAG \
            -PappVersionCode=${{ steps.version.outputs.v_code }} \
            -PappVersionName="${{ steps.version.outputs.v_name }}"

      # 产物定位 + 签名校验：签名不对就不允许发布
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*-release.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::没找到 release APK"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          # 资产名必须纯 ASCII：GitHub 会把非 ASCII 字符替换成 “.”，中文名会变成 EYU.-v2026...
          cp "$APK_PATH" "release/EYU-FileManager-${{ steps.version.outputs.tag }}.apk"
          ( cd release && sha256sum ./*.apk > SHA256SUMS.txt )
          ls -lh release/

      - name: Changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log --pretty=format:'- %s' "$PREV"..HEAD | head -25 || true)
          else
            LOG=$(git log --pretty=format:'- %s' -10)
          fi
          { echo 'log<<EOF'; echo "$LOG"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ env.APP_NAME }} ${{ steps.version.outputs.tag }}"
          body: |
            ## ${{ env.APP_NAME }} 自动构建版本

            - **构建时间**：${{ steps.version.outputs.date }} (UTC+8)
            - **内部版本**：${{ steps.version.outputs.v_name }} (Code: ${{ steps.version.outputs.v_code }})
            - **提交**：${{ github.sha }}
            - **类型**：Release APK（R8 混淆 + 资源压缩，proguard 带 `-dontoptimize`）

            ### 本次变更
            ${{ steps.changelog.outputs.log }}

            ### 安装说明
            1. 下载下方 APK 文件
            2. 允许「未知来源」安装
            3. 可直接覆盖安装旧版本

            ### 校验
            文件旁边附带 `SHA256SUMS.txt`，可用 App 内的「批量校验哈希」核对完整性。
          files: |
            release/*.apk
            release/SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EYU-filemanager-${{ steps.version.outputs.v_name }}
          path: release/*
          retention-days: 14
