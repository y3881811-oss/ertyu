name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # ================== 签名配置缓存 ==================
      - name: Restore Keystore Cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: keystore/mtfm.jks
          key: mtfm-keystore-v1

      - name: Generate Keystore (首次运行)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          keytool -genkeypair \
            -keystore keystore/mtfm.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=MTFM, OU=Dev, O=MTFM, L=City, S=State, C=CN"
          echo "✅ 已生成新 keystore"

      # ================== 核心缓存：Android 构建 & Gradle ==================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.4.1'

      - name: Cache Android Build Cache
        uses: actions/cache@v4
        with:
          path: ~/.android/build-cache
          key: ${{ runner.os }}-android-build-cache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-build-cache-

      - name: Cache Gradle Build Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-build-cache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-cache-

      # ================== 版本号生成 ==================
      - name: Generate Version
        id: version
        run: |
          DATE=$(date -u +'%Y.%m.%d')
          TIME=$(date -u +'%H%M')
          TAG="v${DATE}-${TIME}"
          V_NAME="${DATE}.${TIME}"
          V_CODE=${{ github.run_number }}
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "v_name=${V_NAME}" >> $GITHUB_OUTPUT
          echo "v_code=${V_CODE}" >> $GITHUB_OUTPUT

      # ================== 开始构建 ==================
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --build-cache \
            -PappVersionCode=${{ steps.version.outputs.v_code }} \
            -PappVersionName="${{ steps.version.outputs.v_name }}"

      - name: Rename APK
        run: |
          mkdir -p release
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$SRC" "release/MTFM-${{ steps.version.outputs.tag }}.apk"
          ls -lh release/

      # ================== 发布与上传 ==================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "MTFM ${{ steps.version.outputs.tag }}"
          body: |
            ## MTFM 自动构建版本
            - **构建时间**：${{ steps.version.outputs.date }}
            - **内部版本**：${{ steps.version.outputs.v_name }} (Code: ${{ steps.version.outputs.v_code }})
            - **提交**：${{ github.sha }}
            - **类型**：Release APK (Signed, R8 Optimized)
          files: release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTFM-apk
          path: release/*.apk

      # ================== 缓存保活机制 ==================
      # 使用 restore 动作并在匹配时更新访问时间，if: always() 确保即使构建失败也会刷新
      - name: Keep Cache Alive (Android)
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/build-cache
          key: ${{ runner.os }}-android-build-cache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-build-cache-

      - name: Keep Cache Alive (Gradle)
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-build-cache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-cache-