name: Light Quality Check

on:
  workflow_dispatch: # 手动触发，或者可以设为 push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.4.1'

      # 运行 Lint 检查
      - name: Run Lint
        run: gradle :app:lintDebug --no-daemon --build-cache

      # 直接在日志里打印 Lint 的文本报告
      - name: Print Lint Report
        if: always()
        run: |
          if [ -f "app/build/reports/lint-results-debug.txt" ]; then
            cat app/build/reports/lint-results-debug.txt
          else
            echo "未找到 Lint 报告"
          fi