name: Migrate Keystore Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore keystore from cache
        uses: actions/cache@v4
        with:
          path: keystore/mtfm.jks
          key: mtfm-keystore-v1

      - name: Check keystore exists
        run: |
          if [ ! -f keystore/mtfm.jks ]; then
            echo "::error::缓存里没有 keystore/mtfm.jks（可能已被清理），无法自动迁移"
            exit 1
          fi
          ls -l keystore/mtfm.jks
          sha256sum keystore/mtfm.jks

      - name: Install PyNaCl
        run: pip install --quiet pynacl

      - name: Write KEYSTORE_BASE64 secret
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from nacl import encoding, public

          tok = os.environ["ADMIN_TOKEN"]
          repo = os.environ["REPO"]
          api = f"https://api.github.com/repos/{repo}"
          H = {
              "Authorization": "Bearer " + tok,
              "Accept": "application/vnd.github+json",
              "User-Agent": "keystore-migrate",
          }

          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=30))

          def put(url, body):
              req = urllib.request.Request(url, data=json.dumps(body).encode(), method="PUT",
                                           headers={**H, "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status

          def delete(url):
              req = urllib.request.Request(url, method="DELETE", headers=H)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status

          raw = open("keystore/mtfm.jks", "rb").read()
          b64 = base64.b64encode(raw)

          pk = get(api + "/actions/secrets/public-key")
          pub = public.PublicKey(pk["key"].encode(), encoding.Base64Encoder())
          sealed = public.SealedBox(pub).encrypt(b64)

          st = put(api + "/actions/secrets/KEYSTORE_BASE64", {
              "encrypted_value": base64.b64encode(sealed).decode(),
              "key_id": pk["key_id"],
          })
          print(f"KEYSTORE_BASE64 已写入：证书 {len(raw)} 字节 / base64 {len(b64)} 字符，HTTP {st}")

          st2 = delete(api + "/actions/secrets/ADMIN_TOKEN")
          print(f"临时 ADMIN_TOKEN 已删除，HTTP {st2}")
          PY
