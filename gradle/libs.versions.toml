[versions]
agp = "8.5.0"
kotlin = "2.0.20"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.12.2"
composeBom = "2026.09.00"
commonsCompress = "1.28.0"
xz = "1.12"
zstdJni = "1.5.7-19"
junrar = "7.6.0"
apksig = "8.5.0"
ftpserver = "1.2.1"
shizuku = "13.1.5"
zip4j = "2.11.6"
smbj = "0.14.0"
# 新增与替换的版本
media3 = "1.11.1"
smali = "3.0.10"
apkeditor = "V1.4.9"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
zstd-jni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstdJni" }
junrar = { group = "com.github.junrar", name = "junrar", version.ref = "junrar" }
apksig = { group = "com.android.tools.build", name = "apksig", version.ref = "apksig" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
ftpserver-core = { group = "org.apache.ftpserver", name = "ftpserver-core", version.ref = "ftpserver" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
smbj = { group = "com.hierynomus", name = "smbj", version.ref = "smbj" }

# ===== 替换的依赖 =====
# DEX 解析 (替代旧的 baksmali)
smali = { group = "com.android.tools.smali", name = "smali", version.ref = "smali" }
smali-baksmali = { group = "com.android.tools.smali", name = "smali-baksmali", version.ref = "smali" }
smali-dexlib2 = { group = "com.android.tools.smali", name = "smali-dexlib2", version.ref = "smali" }

# APK 资源与 Manifest 解析 (替代旧的 apk-parser)
apkeditor = { group = "com.github.reandroid", name = "APKEditor", version.ref = "apkeditor" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }