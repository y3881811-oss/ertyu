[versions]
agp = "8.5.0"
kotlin = "2.0.20"
coreKtx = "1.19.1"                # 原 1.13.1
lifecycle = "2.11.0"              # 原 2.8.4
activityCompose = "1.14.0"        # 原 1.9.1
composeBom = "2026.09.00"         # 原 2024.06.00
commonsCompress = "1.28.0"        # 原 1.27.1
xz = "1.12"                       # 原 1.10
zstdJni = "1.5.7-19"              # 原 1.5.6-8
junrar = "7.6.0"                  # 原 7.5.5
apksig = "8.5.0"                  # 与 AGP 绑定，本次不单独升级
smali = "2.5.2"                   # org.smali 坐标已是最新，3.x 需换坐标并改代码
media3 = "1.11.1"                 # 原 1.3.1
ftpserver = "1.2.1"               # 原 1.2.0
shizuku = "13.1.5"                # API 库最新稳定版，保持不变
zip4j = "2.11.6"                  # 原 2.11.5
apkparser = "2.6.10"              # 已是最新，无需升级
smbj = "0.14.0"                   # 原 0.12.2

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
zstd-jni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstdJni" }
junrar = { group = "com.github.junrar", name = "junrar", version.ref = "junrar" }
apksig = { group = "com.android.tools.build", name = "apksig", version.ref = "apksig" }
baksmali = { group = "org.smali", name = "baksmali", version.ref = "smali" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
ftpserver-core = { group = "org.apache.ftpserver", name = "ftpserver-core", version.ref = "ftpserver" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
apk-parser = { group = "net.dongliu", name = "apk-parser", version.ref = "apkparser" }
smbj = { group = "com.hierynomus", name = "smbj", version.ref = "smbj" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }