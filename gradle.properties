# 1. 给 Gradle 分配 8GB 内存（16GB 的一半，最安全且最充裕的配比）
# 增加 MaxMetaspaceSize 防止大量类加载导致元空间 OOM
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# 2. 开启并行构建（充分利用 4 核 CPU）
org.gradle.parallel=true

# 3. 开启构建缓存
org.gradle.caching=true

# 4. 开启配置缓存（大幅减少 Gradle 每次初始化项目的时间）
org.gradle.configuration-cache=true

# 5. 给 Kotlin 编译进程分配内存（独立于 Gradle，防止 Kotlin 编译卡顿）
kotlin.daemon.jvmargs=-Xmx3072m

# 6. Android 官方推荐配置
android.useAndroidX=true
android.nonTransitiveRClass=true

# 7. Kotlin 官方代码风格
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
# 给 Kotlin 编译器分配更多内存并开启并行编译
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=true
